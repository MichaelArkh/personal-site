services:
  personal-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
          VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
          VITE_EXPRESS_SERVER_ADDR: ${VITE_EXPRESS_SERVER_ADDR}
    container_name: personal-site
    environment:
          - NODE_ENV=${NODE_ENV}
          - SERVER_PORT=${SERVER_PORT}
          - WEB_PORT=${WEB_PORT} 
          - MONGO_URI=${MONGO_URI}
    ports:
          - "127.0.0.1:3000:3000"
          - "127.0.0.1:4000:4000"
    restart: unless-stopped